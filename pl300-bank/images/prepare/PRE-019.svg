<svg xmlns="http://www.w3.org/2000/svg" width="560" height="324" viewBox="0 0 560 324" role="img" aria-label="Text/CSV import dialog" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Text/CSV import dialog</title><rect x="0.5" y="0.5" width="559" height="323" rx="4" fill="#FFFFFF" stroke="#C8C6C4" stroke-width="1"/><text x="24" y="38" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#252423" font-weight="600" text-anchor="start">Sales_Q3.csv</text><text x="24" y="70" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">File Origin</text><rect x="24" y="80" width="512" height="30" rx="2" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="34" y="100" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">65001: Unicode (UTF-8)</text><text x="24" y="130" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">Delimiter</text><rect x="24" y="140" width="512" height="30" rx="2" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="34" y="160" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">Comma</text><text x="24" y="190" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">Data Type Detection</text><rect x="24" y="200" width="512" height="30" rx="2" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="34" y="220" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">Based on first 200 rows</text><text x="24" y="250" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start