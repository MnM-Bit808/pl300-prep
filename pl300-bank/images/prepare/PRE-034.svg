<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Report visual showing a DirectQuery row-limit error" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Report visual showing a DirectQuery row-limit error</title><rect x="0.5" y="0.5" width="759" height="299" rx="4" fill="#E9E7E5" stroke="#C8C6C4" stroke-width="1"/><rect x="20" y="20" width="720" height="260" rx="0" fill="#FFFFFF" stroke="#D2D0CE" stroke-width="1"/><text x="36" y="46" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="14" fill="#252423" font-weight="600" text-anchor="start">Transaction details</text><circle cx="380.0" cy="126.0" r="16" fill="none" stroke="#A4262C" stroke-width="2"/><text x="380.0" y="133.0" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#A4262C" font-weight="700" text-anchor="middle">!</text><text x="380.0" y="170.0" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="14" fill="#252423" font-weight="600" text-anchor="middle">Couldn't load the data for this visual</text><text x="380.0" y="190.0" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="middle">The resultset of a query to external data source has exceeded</text><text x="380.0" y="210.0" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="middle">the maximum allowed size of '1000000' rows.</text></svg>