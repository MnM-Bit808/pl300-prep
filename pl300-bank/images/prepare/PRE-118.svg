<svg xmlns="http://www.w3.org/2000/svg" width="560" height="376" viewBox="0 0 560 376" role="img" aria-label="Group By dialog" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Group By dialog</title><rect x="0.5" y="0.5" width="559" height="375" rx="4" fill="#FFFFFF" stroke="#C8C6C4" stroke-width="1"/><text x="24" y="38" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#252423" font-weight="600" text-anchor="start">Group By</text><text x="24" y="70" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">Specify the column to group by and the desired output.</text><circle cx="32" cy="91" r="7" fill="#fff" stroke="#605E5C"/><circle cx="32" cy="91" r="4" fill="#0F6CBD"/><text x="46" y="96" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">Basic</text><circle cx="32" cy="115" r="7" fill="#fff" stroke="#605E5C"/><text x="46" y="120" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">Advanced</text><text x="24" y="144" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">Group by</text><rect x="24" y="154" width="512" height="30" rx="2" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="34" y="174" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">CustomerID</text><text x="24" y="204" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">New column name</text><rect x="24" y="214" width="512" height="30" rx="2" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="34" y="234" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">Orders</text><text x="24" y="264" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="600" text-anchor="start">Operation</text><rect x="24" y="274" width="512" height="30" rx="2" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="34" y="294" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="start">Count Rows</text><rect x="448" y="326" width="88" height="32" rx="3" fill="#0F6CBD" stroke="#0F6CBD" stroke-width="1"/><text x="492.0" y="347" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">OK</text><rect x="352" y="326" width="88" height="32" rx="3" fill="#FFFFFF" stroke="#8A8886" stroke-width="1"/><text x="396.0" y="347" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="13" fill="#252423" font-weight="400" text-anchor="middle">Cancel</text></svg>