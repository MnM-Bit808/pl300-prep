</text><text x="40" y="174" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="12.5" fill="#252423" font-weight="400" text-anchor="start">Tenure is less than 6 months</text><rect x="260.0" y="162" width="67.29166666666667" height="12" rx="0" fill="#118DFF" stroke="none" stroke-width="0"/><text x="380.0" y="174" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="12.5" fill="#252423" font-weight="600" text-anchor="end">1.9x</text><text x="40" y="212" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="12.5" fill="#252423" font-weight="400" text-anchor="start">Support tickets is more than 3</text><rect x="260.0" y="200" width="56.66666666666667" height="12" rx="0" fill="#118DFF" stroke="none" stroke-width="0"/><text x="380.0" y="212" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="12.5" fill="#252423" font-weight="600" text-anchor="end">1.6x</text><line x1="410.0" y1="70" x2="410.0" y2="320" stroke="#E1DFDD" stroke-width="1"/><text x="430.0" y="84" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="12.5" fill="#252423" font-weight="600" text-anchor="start">Contract is Month-to-month</text><text x="430.0" y="102" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="400" text-anchor="start">is 2.4x more likely to be the outcome</text><rect x="480.0" y="184.6" width="60" height="105.4" rx="0" fill="#118DFF" stroke="none" stroke-width="0"/><text x="510.0" y="178.6" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#605E5C" font-weight="400" text-anchor="middle">62%</text><text x="510.0" y="308" font-family="Segoe UI, 'IBM Plex Sans', Arial, sans-serif" font-size="11.5" fill="#252423" font-weight="400" text-anchor="middle">Influencer</text><rect x="620.0" y="246.08333333333331" width="60" height="43.91666666666667" rx="0" fill="#C8C6C4" stroke="none" stroke-width="0"/><text x="650.0" y="240.08333333